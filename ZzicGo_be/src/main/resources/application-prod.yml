cors:
  allowed-origin: http://${PROD_SERVER_IP}

server:
  timezone: Asia/Seoul
  tomcat:
    accesslog:
      basedir: /home/ubuntu/backend/app   # ⭐ 중요
      enabled: true
      directory: logs
      pattern: "%h %l %u %t \"%r\" %s %b %D"
      prefix: access
      suffix: .log

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PROD_DB_ENDPOINT}:3306/${PROD_DB_NAME}?useSSL=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 600000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: none # 맨 처음만 create하고, 이후는 none으로 변경
    show-sql: false
    open-in-view: false
    defer-datasource-initialization: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: zzicgo-post-images


logging:
  file:
    name: app.log
  logback:
    rollingpolicy:
      max-history: 7
      max-file-size: 50MB
      total-size-cap: 300MB
  level:
    root: INFO
    com.ZzicGo: DEBUG
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  access-expire-ms: ${JWT_ACCESS_EXPIRE_MS}
  refresh-expire-ms: ${JWT_REFRESH_EXPIRE_MS}

oauth:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: ${NAVER_REDIRECT_URI}
    token-uri: https://nid.naver.com/oauth2.0/token
    profile-uri: https://openapi.naver.com/v1/nid/me

  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
    token-uri: https://kauth.kakao.com/oauth/token
    profile-uri: https://kapi.kakao.com/v2/user/me