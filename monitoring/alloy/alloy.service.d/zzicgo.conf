[Service]
EnvironmentFile=/etc/alloy/zzicgo.env

# Alloy is independent from the backend service and restarts on its own.
Restart=on-failure
RestartSec=5s

# Keep generated files private. The package already runs the process as alloy.
UMask=0027
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=read-only
