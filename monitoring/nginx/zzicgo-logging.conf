# This file belongs in Nginx's http context. On Ubuntu, copying it to
# /etc/nginx/conf.d/zzicgo-logging.conf normally provides that context.
# $uri intentionally excludes the query string. escape=json protects the JSON
# document from quotes and control characters in user-controlled fields.
log_format zzicgo_json escape=json
  '{'
    '"timestamp":"$time_iso8601",'
    '"application":"zzicgo-nginx",'
    '"environment":"production",'
    '"event":"nginx_access",'
    '"level":"INFO",'
    '"requestId":"$upstream_http_x_request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"durationSeconds":$request_time,'
    '"remoteIp":"$remote_addr",'
    '"userAgent":"$http_user_agent"'
  '}';

# Successful health probes are represented by Synthetic Monitoring metrics and
# would otherwise create a steady stream of duplicate access logs. Keep failed
# probes so an unhealthy response can still be investigated in Loki.
map "$uri:$status" $zzicgo_access_loggable {
  default                                  1;
  ~^/actuator/health:2[0-9][0-9]$          0;
}

# Add these directives to the server block that proxies ZzicGo:
#
# access_log /var/log/nginx/zzicgo_access.log zzicgo_json if=$zzicgo_access_loggable;
# error_log  /var/log/nginx/zzicgo_error.log warn;
#
# Keep the existing proxy_pass and add this inside its location block. The
# backend validates or replaces the value and returns the final X-Request-ID.
#
# proxy_set_header X-Request-ID $request_id;
